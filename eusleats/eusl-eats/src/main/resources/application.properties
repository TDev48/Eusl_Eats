spring.application.name=eusl-eats

# ---- Database (override with environment variables if you like) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_cafeteria}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "none" = never touch the tables (your existing database).
# Set the environment variable DDL_AUTO=update on a NEW, empty database and the
# tables are created automatically.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=false

# ---- Login tokens ----
# Use a long random value in real use (set APP_SECRET as an environment variable).
app.security.secret=${APP_SECRET:eusl-eats-development-secret-change-me-before-deployment}
app.security.token-hours=8

# ---- First admin account (created on start-up if missing) ----
app.admin.email=${ADMIN_EMAIL:admin@eusl.lk}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# ---- Text messages (SMS) to the store's phone number ----
# provider: log (default - only prints to the console), notifylk, or twilio
app.sms.provider=${SMS_PROVIDER:log}
# 0771234567 is sent as 94771234567
app.sms.default-country-code=94

# Notify.lk  (https://notify.lk) - fill these in and set provider to notifylk
app.sms.notifylk.user-id=${NOTIFYLK_USER_ID:}
app.sms.notifylk.api-key=${NOTIFYLK_API_KEY:}
app.sms.notifylk.sender-id=${NOTIFYLK_SENDER_ID:NotifyDEMO}

# Twilio - fill these in and set provider to twilio
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from=${TWILIO_FROM:}


# ---- Food image uploads ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Store uploaded images outside the source-code folders
app.upload.dir=${UPLOAD_DIR:uploads}
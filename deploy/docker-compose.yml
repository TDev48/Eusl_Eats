# EUSL Eats - everything on one server:
#   web      = Caddy: shows the website and gets a free HTTPS certificate
#   backend  = your Spring Boot application
#   db       = the database (data is kept in a Docker volume)
#
# Start / update:  docker compose up -d --build
# See problems:    docker compose logs -f backend

services:
  db:
    image: ${DB_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the .env file}
      MYSQL_DATABASE: smart_cafeteria
      MYSQL_USER: eusl
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
      TZ: Asia/Colombo
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      # every .sql file in this folder runs ONCE, the first time the database is created
      - ./db-init:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: ../eusleats/eusl-eats
    restart: unless-stopped        # also retries until the database is ready
    depends_on:
      - db
    environment:
      TZ: Asia/Colombo             # order times show in Sri Lanka time
      DDL_AUTO: update             # creates any missing database tables by itself
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=55 -XX:+ExitOnOutOfMemoryError"
      DB_URL: jdbc:mysql://db:3306/smart_cafeteria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo&characterEncoding=UTF-8
      DB_USERNAME: eusl
      DB_PASSWORD: ${DB_PASSWORD}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in the .env file}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@eusl.lk}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the .env file}
      UPLOAD_DIR: /app/uploads
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      NOTIFYLK_USER_ID: ${NOTIFYLK_USER_ID:-}
      NOTIFYLK_API_KEY: ${NOTIFYLK_API_KEY:-}
      NOTIFYLK_SENDER_ID: ${NOTIFYLK_SENDER_ID:-NotifyDEMO}
    volumes:
      - uploads:/app/uploads

  web:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../SmartCafeteria:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:

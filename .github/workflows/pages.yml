# Publishes the website files (folder SmartCafeteria) as a free preview on GitHub Pages.
# The preview shows the design only - the back end is not part of GitHub Pages.
name: Publish website preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: SmartCafeteria
      - id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - EUSL Eats</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">

        <a class="store-logo" href="index.html">EUSL <span>Eats</span></a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Student Login</a>
            <a href="store-login.html">Store Login</a>
        </div>

    </nav>

    <section class="login-section">

        <div class="login-container">

            <div class="login-info">

                <h1>Administrator</h1>

                <p>
                    Review new food store registrations and decide
                    which stores can appear on EUSL Eats.
                </p>

                <div class="login-features">

                    <div>
                        <span>🛡️</span>
                        <p>Approve or reject new stores</p>
                    </div>

                    <div>
                        <span>🏪</span>
                        <p>See every registered store</p>
                    </div>

                </div>

            </div>

            <div class="login-box">

                <h2>Admin Login</h2>

                <p class="login-subtitle">
                    Enter your administrator account details
                </p>

                <form id="adminLoginForm">

                    <label for="adminEmail">Email Address</label>
                    <input type="email" id="adminEmail" placeholder="Enter your email" required>

                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter your password" required>

                    <button type="submit" class="login-submit">
                        Login
                    </button>

                </form>

            </div>

        </div>

    </section>

    <footer>
        <p>© 2026 EUSL Eats</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/admin.js"></script>

</body>

</html>
